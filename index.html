<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KotaKita — Discord Message Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<script type="module" src="js/main.js"></script>

</head>
<body>

<!-- Toast -->
<div class="toast" id="toast" aria-live="polite">✓ Disalin ke clipboard!</div>

<!-- Mobile overlay -->
<div class="overlay hidden" id="overlay"></div>

<div class="app">

  <!-- ── HEADER ── -->
  <header class="header">
    <button class="mobile-menu-btn" id="menuBtn" aria-label="Toggle sidebar">
      ☰ <span style="font-size:12px">Menu</span>
    </button>
    <div class="header-logo">
      <div class="logo-badge">🚔</div>
      <div>
        <div class="logo-text">KotaKita</div>
        <div class="logo-sub">Kepolisian Tools</div>
      </div>
    </div>
    <div class="header-spacer"></div>
    <button class="header-preview-btn" id="previewBtn">👁 Preview</button>
    <div class="header-tag">Discord Message Generator</div>
  </header>

  <!-- ── SIDEBAR ── -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-label">Template</div>

    <button class="tpl-btn" data-tpl="barang">
      <div class="tpl-icon">📦</div>
      <div class="tpl-name">
        Barang Bukti
        <span class="tpl-file">barang.md</span>
      </div>
    </button>

    <button class="tpl-btn" data-tpl="peluru">
      <div class="tpl-icon">🎬</div>
      <div class="tpl-name">
        Pengambilan Clip
        <span class="tpl-file">pengambilan-clip.md</span>
      </div>
    </button>

    <button class="tpl-btn" data-tpl="senjata-apd">
      <div class="tpl-icon">🛡️</div>
      <div class="tpl-name">
        Senjata APD
        <span class="tpl-file">senjata-apd.md</span>
      </div>
    </button>

    <button class="tpl-btn" data-tpl="senjata-ilegal">
      <div class="tpl-icon">⚠️</div>
      <div class="tpl-name">
        Senjata Ilegal
        <span class="tpl-file">senjata-ilegal.md</span>
      </div>
    </button>

    <button class="tpl-btn" data-tpl="pasal">
      <div class="tpl-icon">⚖️</div>
      <div class="tpl-name">
        Pasal
        <span class="tpl-file">undang-undang.json</span>
      </div>
    </button>

    <button class="tpl-btn" data-tpl="skck">
      <div class="tpl-icon">📄</div>
      <div class="tpl-name">
        SKCK
        <span class="tpl-file">police-record.md</span>
      </div>
    </button>

    <div class="sidebar-label">Tools</div>

    <button class="tpl-btn" data-tpl="shift-logs">
      <div class="tpl-icon">⏱️</div>
      <div class="tpl-name">
        Shift Logs
        <span class="tpl-file">shift calculator</span>
      </div>
    </button>
  </nav>

  <!-- ── MAIN FORM ── -->
  <main class="main" id="main">
    <div class="form-header">
      <div>
        <div class="form-title" id="formTitle">Pilih Template</div>
        <div class="form-desc" id="formDesc">Pilih salah satu template dari sidebar untuk memulai.</div>
      </div>
      <button class="btn-clear" id="btnClear" style="display:none" aria-label="Clear form">
        🗑 Clear
      </button>
    </div>
    <div id="formArea"></div>
  </main>

  <!-- ── PREVIEW ── -->
  <aside class="preview" id="preview">
    <div class="preview-header">
      <div class="preview-title">
        <div class="preview-dot"></div>
        Live Preview
      </div>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="preview-empty">
        <div class="preview-empty-icon">💬</div>
        <div>Isi form untuk melihat<br>preview pesan Discord.</div>
      </div>
    </div>
    <div class="preview-footer">
      <div class="char-counter" id="charCounter">0 karakter</div>
      <button class="btn-copy" id="btnCopy" disabled aria-label="Copy to clipboard">
        📋 Copy
      </button>
    </div>
  </aside>

</div><!-- .app -->

<footer class="app-footer">
  <span>Created by <a href="https://github.com/raksmala" target="_blank" rel="noopener noreferrer">@raksmala</a></span>
  <span class="app-footer-sep" aria-hidden="true">·</span>
  <span>© 2026 raksmala</span>
</footer>


</body>
</html>
